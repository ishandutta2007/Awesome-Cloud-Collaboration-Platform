<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    /* Dynamic pulsing and drifting animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.7; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.95; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.6; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.9; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPillDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .orb-1 { animation: pulseOrb 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; transform-origin: 1000px 300px; }
    .travel-line { stroke-dasharray: 8, 12; animation: dashTravel 5s linear infinite; }
    .pill-anim-1 { animation: floatPill 6s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPillDelayed 7s ease-in-out infinite 1s; }
    .pill-anim-3 { animation: floatPill 6.5s ease-in-out infinite 2s; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Background layer) -->
  <circle class="orb-1" cx="240" cy="120" r="190" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  <circle class="orb-2" cx="980" cy="300" r="210" fill="url(#glowGrad2)" filter="url(#softGlow)" />

  <!-- Dynamic Constellation / Network Lines (Background layer) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5">
    <path class="travel-line" d="M 80,320 Q 300,380 500,340 T 900,360 T 1120,310" fill="none" />
    <path class="travel-line" d="M 120,90 Q 400,40 680,100 T 1080,70" fill="none" stroke="#a855f7" stroke-opacity="0.25" />
  </g>

  <!-- Modern Floating Feature Badges (Midground layer) -->
  <g class="pill-anim-1">
    <rect x="140" y="325" width="240" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="160" cy="344" r="5" fill="#38bdf8" />
    <text x="176" y="349" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">💬 Team Chat &amp; Messaging</text>
  </g>

  <g class="pill-anim-2">
    <rect x="440" y="325" width="270" height="38" rx="19" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="460" cy="344" r="5" fill="#818cf8" />
    <text x="476" y="349" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">📝 Real-Time Document Co-Edit</text>
  </g>

  <g class="pill-anim-3">
    <rect x="770" y="325" width="290" height="38" rx="19" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="790" cy="344" r="5" fill="#c084fc" />
    <text x="806" y="349" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🔒 Sovereign File Sync &amp; Storage</text>
  </g>

  <!-- Main Foreground Content Area -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 72)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">☁️ CURATED WORKSPACE DIRECTORY</text>
  </g>

  <!-- Foreground Main Title -->
  <text x="600" y="150" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome Cloud Collaboration
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="200" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">
    Enterprise SaaS &amp; Self-Hosted Open-Source Workspace Suites
  </text>

  <!-- Foreground Description / Tagline -->
  <text x="600" y="240" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Curated list of platforms for team chat, real-time docs, kanban management, and self-hosted file sync.
  </text>

  <!-- Sleek Accent Divider -->
  <line x1="450" y1="272" x2="750" y2="272" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
</svg>
